name: Security Lab Tests

on:
  push:
  pull_request:

jobs:
  ssrf-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SSRF regression tests
        run: python -m unittest discover -s tests -p "test_ssrf_protection.py" -v
